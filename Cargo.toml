[package]
name = "gphotosync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "gzip", "form", "http2", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
